<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="SnowFans icon">
  <!--
    SnowFans — Icon (master editable file)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Color tokens (edit here):
      Background       : #020617  (slate-950, matches website)
      Snowflake stroke : #38BDF8  (sky-400)
      Center dot       : #38BDF8  (sky-400)

    Snowflake:
      - 6 arms, each 22px from center
      - Branch at 14px from center (±7px)
      - Stroke width 2.5px, round caps

    Export guide:
      192×192 PNG → PWA icon (icon-192.png)
      512×512 PNG → PWA splash icon (icon-512.png)
      Inkscape: File → Export PNG → select sizes above
      Figma: Export → PNG → 192w, 512w

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  -->

  <defs>
    <g id="sf-arm">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="-7" y1="-14" x2="7" y2="-14"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="56" height="56" rx="12" fill="#020617"/>

  <!-- Snowflake, centered at (28, 28) -->
  <g transform="translate(28,28)"
     stroke="#38BDF8"
     stroke-width="2.5"
     stroke-linecap="round">
    <use href="#sf-arm"/>
    <use href="#sf-arm" transform="rotate(60)"/>
    <use href="#sf-arm" transform="rotate(120)"/>
    <use href="#sf-arm" transform="rotate(180)"/>
    <use href="#sf-arm" transform="rotate(240)"/>
    <use href="#sf-arm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" stroke="none"/>
  </g>

</svg>
