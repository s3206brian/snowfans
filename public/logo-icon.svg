<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="SnowFans icon">
  <!--
    SnowFans — Icon (square)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Use cases: favicon, PWA icon, app icon, avatar

    Color tokens (edit here):
      Snowflake stroke : #38BDF8  (sky-400)
      Center dot fill  : #38BDF8  (sky-400)

    For PWA icon with background:
      Uncomment <rect> below and set fill to your brand color.
      Recommended background: #0F172A (slate-950, matches website)

    For favicon export:
      Open in Inkscape → Export as 32×32 PNG
      Or: browser devtools → screenshot the SVG at target size

    Snowflake structure:
      - Centered at (28, 28)
      - Arm length    : 22px
      - Branch at     : 14px from center (±7px wide)
      - Stroke width  : 2.5px
      - Stroke cap    : round

    Recommended editors: Figma · Inkscape · Adobe Illustrator
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  -->

  <defs>
    <g id="sf-arm-icon">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="-7" y1="-14" x2="7" y2="-14"/>
    </g>
  </defs>

  <!-- Optional background (uncomment for PWA icon) -->
  <!-- <rect width="56" height="56" rx="12" fill="#0F172A"/> -->

  <!-- ── Snowflake, centered at (28, 28) ── -->
  <g transform="translate(28,28)"
     stroke="#38BDF8"
     stroke-width="2.5"
     stroke-linecap="round">
    <use href="#sf-arm-icon"/>
    <use href="#sf-arm-icon" transform="rotate(60)"/>
    <use href="#sf-arm-icon" transform="rotate(120)"/>
    <use href="#sf-arm-icon" transform="rotate(180)"/>
    <use href="#sf-arm-icon" transform="rotate(240)"/>
    <use href="#sf-arm-icon" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" stroke="none"/>
  </g>

</svg>
