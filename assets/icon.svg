<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- App Store icon: full-bleed (iOS applies its own corner mask), no transparency -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <g id="sf-arm">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="-7" y1="-14" x2="7" y2="-14"/>
    </g>
  </defs>
  <rect width="56" height="56" fill="url(#bg)"/>
  <g transform="translate(28,28) scale(0.78)" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round">
    <use href="#sf-arm"/>
    <use href="#sf-arm" transform="rotate(60)"/>
    <use href="#sf-arm" transform="rotate(120)"/>
    <use href="#sf-arm" transform="rotate(180)"/>
    <use href="#sf-arm" transform="rotate(240)"/>
    <use href="#sf-arm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" stroke="none"/>
  </g>
</svg>
