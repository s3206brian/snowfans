<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SnowFans</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #020617; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { margin: 0; font-size: 28px; font-weight: 800; }
    h1 span { background: linear-gradient(90deg, #38bdf8, #2dd4bf); -webkit-background-clip: text; color: transparent; }
    p { margin: 0; color: #94a3b8; font-size: 15px; line-height: 1.6; }
    button { margin-top: 8px; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 15px;
      font-weight: 600; color: #fff; background: #2563eb; }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <div style="font-size:48px" aria-hidden="true">🏔️</div>
    <h1>Snow<span>Fans</span></h1>
    <p>目前沒有網路連線<br />請確認 Wi-Fi 或行動網路後再試一次</p>
    <button id="retry" type="button">重新連線</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.href = 'https://snowfans.org/explore'
    })
    window.addEventListener('online', function () {
      location.href = 'https://snowfans.org/explore'
    })
  </script>
</body>
</html>
