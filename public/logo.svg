<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="SnowFans">
  <!--
    SnowFans — Horizontal Logo
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Color tokens (edit here):
      Snowflake stroke : #38BDF8  (sky-400)
      "snow" text      : #7DD3FC  (sky-300)
      "fans" text      : #FFFFFF  (white)

    For light background: change #FFFFFF → #0F172A

    Snowflake structure (in <defs id="sf-arm">):
      - Main arm length : 22px from center
      - Branch position : 14px from center (63% of arm)
      - Branch width    : ±7px

    Wordmark:
      - Font size       : 24px
      - "snow"          : font-weight 300 (light)
      - "fans"          : font-weight 700 (bold)

    Recommended editors: Figma · Inkscape · Adobe Illustrator
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  -->

  <defs>
    <!-- One snowflake arm: points upward from origin, branch at y=-14 -->
    <g id="sf-arm">
      <line x1="0" y1="0" x2="0" y2="-22"/>
      <line x1="-7" y1="-14" x2="7" y2="-14"/>
    </g>
  </defs>

  <!-- ── Icon: geometric snowflake, centered at (28, 28) ── -->
  <g id="icon"
     transform="translate(28,28)"
     stroke="#38BDF8"
     stroke-width="2.5"
     stroke-linecap="round">
    <use href="#sf-arm"/>
    <use href="#sf-arm" transform="rotate(60)"/>
    <use href="#sf-arm" transform="rotate(120)"/>
    <use href="#sf-arm" transform="rotate(180)"/>
    <use href="#sf-arm" transform="rotate(240)"/>
    <use href="#sf-arm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" stroke="none"/>
  </g>

  <!-- ── Wordmark ── -->
  <text id="wordmark"
        x="64" y="36"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="24"
        letter-spacing="-0.5">
    <tspan fill="#7DD3FC" font-weight="300">snow</tspan><tspan fill="#FFFFFF" font-weight="700">fans</tspan>
  </text>

</svg>
